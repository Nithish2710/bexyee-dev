<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#242220" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0b0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fabricShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1a"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0d0d0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#stageGlow)"/>

  <!-- T-Shirt Back Silhouette -->
  <g filter="url(#shadow)">
    <path d="M340 200 C420 220 580 220 660 200 L860 300 C890 315 880 370 840 410 L760 460 L730 380 L730 960 C730 990 710 1000 680 1000 L320 1000 C290 1000 270 990 270 960 L270 380 L240 460 L160 410 C120 370 110 315 140 300 Z" fill="url(#fabricShade)" stroke="#2a2826" stroke-width="2"/>
    
    <!-- High Neck Collar Line -->
    <path d="M340 200 C420 230 580 230 660 200" stroke="#383532" stroke-width="4" fill="none"/>
    
    <!-- Bold Typography Graphic Back Print -->
    <g transform="translate(500, 520)" text-anchor="middle">
      <text y="-80" font-family="sans-serif" font-size="52" font-weight="900" fill="#f4f1eb" letter-spacing="6">SIGNAL</text>
      <text y="-15" font-family="sans-serif" font-size="52" font-weight="900" fill="#e52b20" letter-spacing="6">AFTER RAIN</text>
      
      <line x1="-180" y1="35" x2="180" y2="35" stroke="#3f3f46" stroke-width="2"/>
      
      <text y="70" font-family="monospace" font-size="14" font-weight="700" fill="#a8a29e" letter-spacing="4">12°58'32&quot;N  77°35'44&quot;E</text>
      <text y="95" font-family="monospace" font-size="12" font-weight="500" fill="#71717a" letter-spacing="2">320 GSM HEAVY LOOPKNIT // LIMITED 100 UNITS</text>
      <text y="140" font-family="monospace" font-size="11" font-weight="700" fill="#f4f1eb" letter-spacing="8">BEXYEE UNIFORM SYSTEM</text>
    </g>

    <!-- Lower Hem Signal Tag -->
    <rect x="722" y="920" width="8" height="32" fill="#e52b20"/>
  </g>
</svg>
