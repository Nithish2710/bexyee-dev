<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="printGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2724"/>
      <stop offset="100%" stop-color="#0b0b0a"/>
    </radialGradient>
    <pattern id="loopknitGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#000000" opacity="0.6"/>
      <circle cx="8" cy="8" r="1.2" fill="#000000" opacity="0.6"/>
      <circle cx="2" cy="8" r="0.8" fill="#33302c" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1000" height="1200" fill="url(#printGlow)"/>
  <rect width="1000" height="1200" fill="url(#loopknitGrid)"/>

  <!-- High-Def Close Up of Print and Texture -->
  <g transform="translate(500, 560)" text-anchor="middle">
    <!-- Screen Print Texture Underlayer -->
    <rect x="-380" y="-220" width="760" height="440" fill="#121110" stroke="#262422" stroke-width="2" rx="6"/>
    
    <text y="-80" font-family="sans-serif" font-size="64" font-weight="900" fill="#f4f1eb" letter-spacing="8">SIGNAL</text>
    <text y="0" font-family="sans-serif" font-size="64" font-weight="900" fill="#e52b20" letter-spacing="8">AFTER RAIN</text>
    
    <line x1="-240" y1="55" x2="240" y2="55" stroke="#e52b20" stroke-width="3"/>
    
    <text y="95" font-family="monospace" font-size="16" font-weight="700" fill="#a8a29e" letter-spacing="4">320 GSM HEAVY LOOPKNIT</text>
    <text y="125" font-family="monospace" font-size="13" font-weight="500" fill="#71717a" letter-spacing="2">HIGH-DENSITY SCREENPRINT // RUBBERIZED MATTE</text>
    <text y="165" font-family="monospace" font-size="12" font-weight="900" fill="#f4f1eb" letter-spacing="6">BEXYEE ARCHIVE // BLR-001</text>
  </g>
</svg>
