<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#242220" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b0b0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fabricShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1a"/>
      <stop offset="50%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#0d0d0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1000" height="1200" fill="url(#stageGlow)"/>

  <!-- Left Profile / Sleeve Focus -->
  <g filter="url(#shadow)">
    <path d="M420 220 C460 250 560 250 600 220 L760 320 C780 340 770 380 740 420 L580 820 C560 860 520 860 480 820 L360 480 L360 960 C360 990 340 1000 310 1000 L260 1000 L260 340 Z" fill="url(#fabricShade)" stroke="#2a2826" stroke-width="2"/>
    
    <!-- Sleeve Drop Shoulder Seam -->
    <path d="M520 235 Q500 350 480 440" stroke="#0a0908" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Left Sleeve Coordinate Badge -->
    <g transform="translate(600, 520) rotate(15)">
      <rect x="-60" y="-20" width="120" height="40" fill="#0b0b0a" stroke="#e52b20" stroke-width="2" rx="2"/>
      <text x="0" y="5" font-family="monospace" font-size="11" font-weight="900" fill="#f4f1eb" text-anchor="middle" letter-spacing="2">BLR / 12°N</text>
    </g>
  </g>
</svg>
